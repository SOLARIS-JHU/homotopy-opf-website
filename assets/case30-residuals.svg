<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc">
<title id="title">Case30: reported mean equality violations</title>
<desc id="desc">Table I, arXiv 2511.11677 version 1. Seven methods are compared over 100 test instances. Dots show the average of the reported mean equality-violation metric; bars extend one standard deviation on either side. Tx-stepping with GPen has average 0.0017 and standard deviation 0.0009; the original penalty baseline has average 0.0036 and standard deviation 0.0027. These are empirical residuals, not feasibility guarantees.</desc>
